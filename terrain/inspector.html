<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>W07 — NIF/source inspector (Rosetta pipeline: NifModelReader IR + graph/TRS/materials/controllers + Three r187 reference stage)</title>
<style>
  body { background: #111; color: #ddd; font-family: monospace; margin: 0; font-size: 11px; }
  #badges { position: fixed; top: 0; left: 0; right: 0; background: #1a1a22; padding: 6px 10px;
            display: flex; flex-wrap: wrap; gap: 8px; align-items: center; z-index: 10;
            border-bottom: 1px solid #333; }
  .badge { background: #2a2a35; border-radius: 4px; padding: 3px 8px; white-space: nowrap; }
  .badge b { color: #fbbf24; }
  .badge.fail { background: #7f1d1d; }
  .badge.ok { background: #14532d; }
  .badge.ref { background: #b45309; }
  #layout { position: fixed; inset: 30px 0 0 0; display: flex; }
  #graph { width: 320px; min-width: 240px; overflow: auto; background: #141419;
           border-right: 1px solid #333; padding: 8px; }
  #details { width: 400px; min-width: 280px; overflow: auto; background: #141419;
             border-right: 1px solid #333; padding: 8px; }
  #viewwrap { flex: 1; position: relative; }
  #view { position: absolute; inset: 0; }
  #viewmsg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
             color: #f87171; text-align: center; padding: 24px; pointer-events: none; }
  .node { padding: 1px 4px; cursor: pointer; border-radius: 3px; white-space: nowrap; }
  .node:hover { background: #2a2a35; }
  .node.sel { background: #1d4ed8; }
  .nodedepth { color: #666; }
  .refline { color: #6b7280; padding-left: 12px; }
  h3 { color: #fbbf24; margin: 12px 0 4px 0; font-size: 12px; border-bottom: 1px solid #333; }
  table { border-collapse: collapse; }
  td { padding: 1px 6px 1px 2px; vertical-align: top; }
  td.k { color: #9ca3af; white-space: nowrap; }
  .hex { color: #94a3b8; word-break: break-all; }
  .failbox { background: #450a0a; border: 1px solid #7f1d1d; padding: 8px; margin: 6px 0; white-space: pre-wrap; }
  .refbox { background: #1c1917; border: 1px solid #44403c; padding: 8px; margin: 6px 0; white-space: pre-wrap; }
  select { background: #2a2a35; color: #ddd; border: 1px solid #444; font-family: monospace; }
  #hud { position: fixed; bottom: 4px; left: 8px; color: #6b7280; z-index: 10; }
</style>
<script type="importmap">
{ "imports": {
    "three": "/node_modules/three/build/three.module.js",
    "three/addons/": "/node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<div id="badges">
  <select id="assetSelect" title="asset"></select>
  <span class="badge" id="b-era">era: <b>…</b></span>
  <span class="badge" id="b-version">format: <b>…</b></span>
  <span class="badge" id="b-revision">three: <b>…</b></span>
  <span class="badge" id="b-sha">sha256: <b>…</b></span>
  <span class="badge" id="b-status">status: <b>…</b></span>
  <span class="badge" id="b-blocks">blocks: <b>…</b></span>
</div>
<div id="layout">
  <div id="graph">loading…</div>
  <div id="details">loading…</div>
  <div id="viewwrap">
    <div id="view"></div>
    <div id="viewmsg"></div>
  </div>
</div>
<div id="hud">W07 NIF inspector — REFERENCE ASSET STAGE (axes/orbit diagnostic presentation; NOT world instance positions; NOT the original PE environment)</div>
<script type="module" src="/terrain/inspector.js"></script>
</body>
</html>
